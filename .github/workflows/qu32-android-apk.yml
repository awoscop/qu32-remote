name: QU32 Remote - Android APK

# Manual run: Actions > "QU32 Remote - Android APK" > Run workflow. The APK is attached as a build artifact.
# The APK is signed with the Expo prebuild debug keystore: fine for sideloading to your own phones,
# NOT for Play Store upload (use `eas build --profile production` for that).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", "sdk/**", ".github/workflows/qu32-android-apk.yml"]
    
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Test protocol, SDK and gateway
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Install app dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Typecheck app
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: qu32-remote-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
